hydra:
  run:
    dir: /mnt/workspace/xts/mathrl/Project1/hydra_outputs/manual_run
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/mnt/workspace/xts/mathrl/Project1/hydra_outputs/manual_run
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=/mnt/workspace/xts/mathrl/Project1/data/math_train_fixed.parquet
    - data.val_files=/mnt/workspace/xts/mathrl/Project1/data/MATH-500.parquet
    - data.train_batch_size=32
    - data.max_prompt_length=1024
    - data.max_response_length=1024
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - +model.torch_dtype=bfloat16
    - actor_rollout_ref.model.path=/mnt/data/xts/models/Qwen2.5-7B-Instruct
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision.param=bfloat16
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision.reduce=bfloat16
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision.buffer=bfloat16
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.model.use_remove_padding=False
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.actor.use_kl_loss=False
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.fsdp_config.param_offload=True
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
    - +actor_rollout_ref.rollout.max_model_len=2048
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.dtype=float16
    - actor_rollout_ref.actor.strategy=fsdp
    - actor_rollout_ref.actor.ppo_mini_batch_size=32
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.mode=async
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.85
    - actor_rollout_ref.rollout.n=16
    - actor_rollout_ref.rollout.do_sample=True
    - actor_rollout_ref.rollout.temperature=1.0
    - actor_rollout_ref.rollout.top_p=0.95
    - actor_rollout_ref.rollout.enable_chunked_prefill=True
    - actor_rollout_ref.rollout.enable_prefix_caching=True
    - actor_rollout_ref.rollout.max_num_batched_tokens=8192
    - actor_rollout_ref.actor.use_dynamic_bsz=True
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=32768
    - actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=True
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=32768
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.ref.fsdp_config.param_offload=True
    - trainer.logger=wandb
    - trainer.project_name=verl_grpo_math_xts
    - trainer.experiment_name=qwen2_5_7b_dapomath_grpo_vllm_t1.0_klFalse_beta0.001
    - trainer.default_local_dir=/mnt/workspace/xts/mathrl/Project1/verl_outputs
    - trainer.n_gpus_per_node=2
    - trainer.nnodes=1
    - trainer.save_freq=100
    - trainer.max_actor_ckpt_to_keep=1
    - trainer.max_critic_ckpt_to_keep=1
    - trainer.resume_mode=auto
    - trainer.test_freq=20
    - trainer.total_epochs=5
    - trainer.val_before_train=True
    - trainer.device=cuda
    - +ray_kwargs.ray_init.include_dashboard=False
    - reward_model.strategy=naive
    - +reward_model.num_examine=5
    - global_profiler.tool=None
    - global_profiler.steps=[2,4]
    - global_profiler.save_path=/mnt/workspace/xts/mathrl/Project1/profile_data
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.actor.fsdp_config.mixed_precision.buffer=bfloat16,+actor_rollout_ref.actor.fsdp_config.mixed_precision.param=bfloat16,+actor_rollout_ref.actor.fsdp_config.mixed_precision.reduce=bfloat16,+actor_rollout_ref.rollout.max_model_len=2048,+model.torch_dtype=bfloat16,+ray_kwargs.ray_init.include_dashboard=False,+reward_model.num_examine=5,actor_rollout_ref.actor.fsdp_config.optimizer_offload=True,actor_rollout_ref.actor.fsdp_config.param_offload=True,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_max_token_len_per_gpu=32768,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2,actor_rollout_ref.actor.ppo_mini_batch_size=32,actor_rollout_ref.actor.strategy=fsdp,actor_rollout_ref.actor.use_dynamic_bsz=True,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/mnt/data/xts/models/Qwen2.5-7B-Instruct,actor_rollout_ref.model.use_remove_padding=False,actor_rollout_ref.ref.fsdp_config.param_offload=True,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.rollout.do_sample=True,actor_rollout_ref.rollout.dtype=float16,actor_rollout_ref.rollout.enable_chunked_prefill=True,actor_rollout_ref.rollout.enable_prefix_caching=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.85,actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=32768,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.rollout.log_prob_use_dynamic_bsz=True,actor_rollout_ref.rollout.max_num_batched_tokens=8192,actor_rollout_ref.rollout.mode=async,actor_rollout_ref.rollout.n=16,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.temperature=1.0,actor_rollout_ref.rollout.tensor_model_parallel_size=1,actor_rollout_ref.rollout.top_p=0.95,algorithm.adv_estimator=grpo,data.filter_overlong_prompts=True,data.max_prompt_length=1024,data.max_response_length=1024,data.train_batch_size=32,data.train_files=/mnt/workspace/xts/mathrl/Project1/data/math_train_fixed.parquet,data.truncation=error,data.val_files=/mnt/workspace/xts/mathrl/Project1/data/MATH-500.parquet,global_profiler.save_path=/mnt/workspace/xts/mathrl/Project1/profile_data,global_profiler.steps=[2,4],global_profiler.tool=None,reward_model.strategy=naive,trainer.default_local_dir=/mnt/workspace/xts/mathrl/Project1/verl_outputs,trainer.device=cuda,trainer.experiment_name=qwen2_5_7b_dapomath_grpo_vllm_t1.0_klFalse_beta0.001,trainer.logger=wandb,trainer.max_actor_ckpt_to_keep=1,trainer.max_critic_ckpt_to_keep=1,trainer.n_gpus_per_node=2,trainer.nnodes=1,trainer.project_name=verl_grpo_math_xts,trainer.resume_mode=auto,trainer.save_freq=100,trainer.test_freq=20,trainer.total_epochs=5,trainer.val_before_train=True
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /mnt/workspace/xts/mathrl/Project1/verl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /mnt/workspace/xts/mathrl/Project1/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /mnt/workspace/xts/mathrl/Project1/hydra_outputs/manual_run
    choices:
      algorithm@algorithm.rollout_correction: rollout_correction
      reward_model: dp_reward_model
      critic: dp_critic
      critic/../engine@critic.model.fsdp_config: fsdp
      critic/../optim@critic.optim: fsdp
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      data: legacy_data
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
